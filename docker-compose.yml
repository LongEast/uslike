services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: uslike
      POSTGRES_USER: uslike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uslike -d uslike"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://uslike:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/uslike
      PORT: "8000"
      USLIKE_UPLOADS_PATH: /var/lib/uslike/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/var/lib/uslike/uploads
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
